name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: |
          ls -la tests tests/snapshots
          head -c 300 tests/snapshots/test_devices.ambr
          git status --short | head
          python -m pytest -q tests/test_devices.py -x -vv -k split_ac 2>&1 | grep -v '^E  ' | tail -60
          python -m pytest -q
